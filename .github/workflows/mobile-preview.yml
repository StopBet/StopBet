name: Mobile Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-types/**'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared-types publica main/types a dist/, y dist/ esta en .gitignore: en CI llega
      # vacio. Metro resuelve @stopbet/shared-types a ese dist, asi que sin este paso el
      # bundle no encuentra isValidRut ni chileanDateToIso y el APK falla. Localmente no se
      # nota porque el dist ya existe de builds previas. backend-ci.yml ya hace lo mismo.
      - name: Build shared-types
        run: pnpm --filter @stopbet/shared-types run build

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}
          restore-keys: gradle-

      # Si el secret esta vacio esto escribia un archivo en blanco y el build moria
      # tres tareas mas adelante con "Malformed root json", sin decir la causa real.
      - name: Create google-services.json
        run: |
          set -e
          destino=apps/mobile/android/app/google-services.json
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > "$destino"
          if ! python3 -c "import json,sys; json.load(open('$destino'))" 2>/dev/null; then
            echo "::error::El secret GOOGLE_SERVICES_JSON esta vacio o no es JSON valido."
            echo "Configuralo en Settings > Secrets and variables > Actions con el"
            echo "contenido del google-services.json del proyecto Firebase."
            exit 1
          fi
          echo "google-services.json escrito y validado"

      # react-native 0.86 saco hermesc de sdks/hermesc y lo movio al paquete
      # hermes-compiler, que declara como dependencia propia. La ruta vieja ya no
      # existe, y el "|| true" hacia que el chmod fallara en silencio: por eso
      # Gradle no encontraba el binario y el error apuntaba a la ruta antigua.
      - name: Prepare hermesc
        run: |
          set -e
          ruta=$(find node_modules -path '*hermes-compiler/hermesc/linux64-bin/hermesc' | head -1)
          test -n "$ruta"
          chmod +x "$ruta"
          echo "hermesc encontrado en $ruta"

      - name: Build APK
        run: cd apps/mobile/android && ./gradlew assembleRelease --no-daemon

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: equipo
          file: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Build automático del commit ${{ github.sha }}"
