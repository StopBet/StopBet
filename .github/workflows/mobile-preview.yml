name: Mobile Preview

# DESACTIVADO EL DISPARO AUTOMATICO — 20-08-2026
#
# Este workflow falla en 'Build APK' desde junio y mandaba un correo de fallo en
# cada merge a main. No esta cubierto por ningun criterio del Sprint 1 y no
# bloquea a nadie: solo genera la preview de Firebase App Distribution.
#
# La causa NO es de configuracion. El paquete react-native@0.86.0 instalado esta
# incompleto respecto a su propio package.json: declara 'sdks/hermesc' y
# 'scripts/hermes/prepare-hermes-for-build.js' en "files", pero ninguno de los dos
# llega en el tarball. Por eso Gradle responde:
#   "Couldn't determine Hermesc location ... sdks/hermesc/%OS-BIN%/hermesc"
# No hay ruta de gradle ni ajuste de pnpm que lo arregle: el binario no existe.
# (nodeLinker esta en 'hoisted', asi que las rutas del build.gradle son correctas.)
#
# Salidas reales, ambas con impacto en el producto y a decidir por el equipo:
#   1. Cambiar la version de React Native por una cuyo tarball si traiga hermesc
#   2. hermesEnabled=false en release, que cambia el motor JS de la app
#
# Mientras tanto queda solo manual (workflow_dispatch) para no ensuciar el CI.
# Al reactivar el disparo automatico, borrar este bloque.
on:
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      - name: Prepare hermesc
        run: chmod +x node_modules/react-native/sdks/hermesc/linux64-bin/hermesc || true

      - name: Build APK
        run: cd apps/mobile/android && ./gradlew assembleRelease --no-daemon

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: equipo
          file: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Build automático del commit ${{ github.sha }}"
