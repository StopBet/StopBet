name: Mobile Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-types/**'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/mobile/android/app/google-services.json

      # react-native 0.86 saco hermesc de sdks/hermesc y lo movio al paquete
      # hermes-compiler, que declara como dependencia propia. La ruta vieja ya no
      # existe, y el "|| true" hacia que el chmod fallara en silencio: por eso
      # Gradle no encontraba el binario y el error apuntaba a la ruta antigua.
      - name: Prepare hermesc
        run: |
          set -e
          ruta=$(find node_modules -path '*hermes-compiler/hermesc/linux64-bin/hermesc' | head -1)
          test -n "$ruta"
          chmod +x "$ruta"
          echo "hermesc encontrado en $ruta"

      - name: Build APK
        run: cd apps/mobile/android && ./gradlew assembleRelease --no-daemon

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: equipo
          file: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Build automático del commit ${{ github.sha }}"
